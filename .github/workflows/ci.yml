name: Build PS4 FreeBSD Target

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (FreeBSD x86_64 / PS4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Install Compatible CMake
        run: |
          python3 -m pip install --upgrade pip
          pip install cmake==3.28.3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-freebsd

      - name: Build Release Binary for FreeBSD
        run: |
          cargo build --release --target x86_64-unknown-freebsd

      - name: Archive Built Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-xbox-ps4
          path: target/x86_64-unknown-freebsd/release/roblox-2016-xbox
