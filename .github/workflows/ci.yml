name: Build Roblox 2016 Xbox Shell

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-freebsd
            name: freebsd-orbis-ps4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2016-xbox-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/roblox-2016-xbox
            assets/
