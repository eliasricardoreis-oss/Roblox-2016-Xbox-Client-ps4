[package]
name = "roblox-2016-xbox"
version = "0.1.4-ps4"
edition = "2021"

[dependencies]
sdl2 = { version = "0.37", features = ["bundled", "static-link"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
image = "0.25"
directories = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
rodio = "0.19"

[target.'cfg(target_os = "freebsd")'.dependencies]
# No FreeBSD/PS4 omitimos completamente o rodio ou quaisquer crates que puxem ALSA/PulseAudio
