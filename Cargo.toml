[package]
name = "roblox-2016-xbox"
version = "0.1.4-ps4"
edition = "2024"
rust-version = "1.95"
description = "Rust reimplementation of the 2016 Roblox console shell (PS4 Port)"
license = "MIT OR Apache-2.0"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "native-tls"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gilrs = "0.11"
rodio = { version = "0.23", default-features = false, features = ["wav", "mp3", "flac"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
thiserror = "2"
secrecy = "0.10.3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
